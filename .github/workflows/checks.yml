name: checks
on:
  - push
  - pull_request
  - workflow_call

permissions:
  contents: read

jobs:
  lint:
    uses: adonisjs/.github/.github/workflows/lint.yml@616f1f5863b4a3a73eb49cd0d16e8719bcd34e7a # next

  typecheck:
    uses: adonisjs/.github/.github/workflows/typecheck.yml@616f1f5863b4a3a73eb49cd0d16e8719bcd34e7a # next

  tests-main:
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version:
          - latest
          - 24.x
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
      - name: Run tests
        run: npm test main
        env:
          GCS_KEY: ${{ secrets.GCS_KEY }}
          GCS_BUCKET: drive-gcs
          GCS_OTHER_BUCKET: flydrive-other-bucket
          GCS_FINE_GRAINED_ACL_BUCKET: drive-gcs-no-uniform-acl

  tests-gcs:
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    concurrency:
      group: gcs
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version:
          - latest
          - 24.x
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
      - name: Run tests
        run: npm test gcs
        env:
          GCS_KEY: ${{ secrets.GCS_KEY }}
          GCS_BUCKET: drive-gcs
          GCS_OTHER_BUCKET: flydrive-other-bucket
          GCS_FINE_GRAINED_ACL_BUCKET: drive-gcs-no-uniform-acl

  tests-s3:
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    concurrency:
      group: s3
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version:
          - latest
          - 24.x
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
      - name: Run tests
        run: npm test s3
        env:
          S3_SERVICE: do
          S3_BUCKET: testing-flydrive
          S3_OTHER_BUCKET: drive-other-bucket
          S3_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}
          S3_ACCESS_SECRET: ${{ secrets.DO_ACCESS_SECRET }}
          S3_ENDPOINT: https://sgp1.digitaloceanspaces.com
          S3_REGION: sgp1
          S3_CDN_URL: https://testing-flydrive.sgp1.cdn.digitaloceanspaces.com

  tests-r2:
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    concurrency:
      group: r2
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version:
          - latest
          - 24.x
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
      - name: Run tests
        run: npm test s3
        env:
          S3_SERVICE: r2
          S3_BUCKET: testing-flydrive
          S3_OTHER_BUCKET: flydrive-other-bucket
          S3_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          S3_ACCESS_SECRET: ${{ secrets.R2_ACCESS_SECRET }}
          S3_ENDPOINT: https://b7d56a259a224b185a70dd6e6f77d9c3.r2.cloudflarestorage.com
          S3_CDN_URL: https://pub-7bacaefbafa643faa5799c5bf17a5b3d.r2.dev
          S3_REGION: auto
